[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vra-python-parsers"
version = "0.1.0"
description = "Python AST parser and call graph builder for Vulnerability Reachability Analyzer"
authors = [
  {name = "VRA Team", email = "vra@example.com"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["ast", "call-graph", "security", "analysis"]

dependencies = [
  "networkx>=3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "black>=23.9.0",
  "pylint>=3.0.0",
  "mypy>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=adapters/parsers/python_parser"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pylint.messages_control]
disable = ["C0330", "C0326"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
