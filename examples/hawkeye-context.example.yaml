# Hawkeye Context Configuration
#
# This file allows security teams to provide infrastructure and security context
# that can adjust reachability scoring in Hawkeye reports.
#
# Use case: A CVE marked as "taint-reachable" (Level 3) in code analysis
# might actually be Level 1 in reality if protected by authentication,
# WAF rules, or network segmentation.
#
# Example: vra report analysis.json --format docx --context hawkeye-context.yaml --output report.docx

application:
  name: sample-app
  description: "Sample Node.js application"
  internet_facing: true
  environment: production

network:
  # Firewall and WAF rules
  firewall_rules:
    # Rule 1: Endpoint protected by WAF
    - endpoint: "POST /api/process-data"
      blocked: true
      reason: "ModSecurity rule detects prototype pollution patterns"
      waf: "ModSecurity 3.x"

    # Rule 2: Endpoint rate-limited
    - endpoint: "POST /api/auth"
      blocked: false
      rate_limit: "10 requests per minute"
      waf: "AWS WAF rate limiting"

    # Rule 3: Wildcard pattern
    - endpoint: "/admin/*"
      blocked: true
      reason: "Admin endpoints only accessible from internal IPs"

  # Network segmentation
  segmentation:
    database_access: "internal-only"
    cache_layer: "private subnet"
    api_calls: "restricted to internal VPC"

  vpc_internal: false
  allowed_ips:
    - "10.0.0.0/8"    # Internal network
    - "203.0.113.0/24" # Partner network

authentication:
  # Specific endpoint gates
  gates:
    # Gate 1: Bearer token required
    - endpoint: "/api/process-data"
      gate: "requireBearerToken()"
      bypass: false
      description: "API endpoints require valid JWT token"

    # Gate 2: Admin role required
    - endpoint: "/admin/*"
      gate: "requireRole('admin')"
      bypass: false
      description: "Admin endpoints restricted to admin users"

    # Gate 3: Public endpoint (no auth)
    - endpoint: "GET /health"
      gate: "public"
      bypass: true
      description: "Health check is publicly accessible"

  # Default: require authentication
  default_requires_auth: true

validation:
  # Input validation and sanitization
  validators:
    # Validator 1: Strict JSON schema
    - endpoint: "POST /api/process-data"
      validates: "JSON Schema v7 — strict mode"
      sanitizes:
        - "__proto__"
        - "constructor"
        - "prototype"
      schema: "schemas/process-data-request.json"

    # Validator 2: HTML escaping
    - endpoint: "POST /api/comments"
      validates: "HTML content sanitized"
      sanitizes:
        - "<script>"
        - "<iframe>"
        - "javascript:"

    # Validator 3: SQL parameter binding
    - endpoint: "GET /search"
      validates: "Parameterized queries only"
      schema: "All queries use prepared statements"

custom:
  # Custom metadata for your team
  last_security_audit: "2026-09-15"
  audit_team: "Security Team A"
  notes: "All findings in this context are based on infrastructure review conducted 2026-09-01"
